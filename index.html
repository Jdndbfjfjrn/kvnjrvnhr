<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НейроХаб — 23 нейросети в Telegram</title>
    
    <!-- Автоматический редирект в бота через 2 секунды (можно убрать при желании) -->
    <!-- <meta http-equiv="refresh" content="3; url=https://t.me/neirohabr_bot"> -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
        }

        .avatar svg {
            width: 52px;
            height: 52px;
            fill: #ffffff;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .username {
            display: inline-block;
            color: #38bdf8;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 18px;
            text-decoration: none;
        }

        p.desc {
            font-size: 15px;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .btn-tg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #229ed9;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(34, 158, 217, 0.4);
            transition: all 0.2s ease;
        }

        .btn-tg:hover {
            background: #1e8ec4;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(34, 158, 217, 0.5);
        }

        .btn-tg:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .37z"/>
            </svg>
        </div>

        <h1>НейроХаб</h1>
        <a href="https://t.me/neirohabr_bot" class="username">@neirohabr_bot</a>

        <p class="desc">
            23 топовые нейросети в одном месте.<br>
            Решение задач по фото, генерация кода, написание текстов и экспорт в файлы без VPN.
        </p>

        <a href="https://t.me/neirohabr_bot" class="btn-tg">
            <span>Открыть бота</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <div class="footer">
            Запуск прямо в Telegram
        </div>
    </div>

</body>
</html>
